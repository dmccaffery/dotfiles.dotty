# Rendered by dotty init for the component named in the file name; the next
# init re-renders it and deselecting the component removes it. Add your own
# packages to ../config.toml instead.
[tools]
"aqua:derailed/k9s" = "latest"
"aqua:kubernetes/kubernetes/kubectl" = "latest"
"aqua:abiosoft/colima" = "latest"
"aqua:lima-vm/lima" = "latest"
"aqua:docker/cli" = "latest"
"aqua:docker/compose" = "latest"
"aqua:fluxcd/flux2" = "latest"
"aqua:docker/buildx" = { version = "latest", postinstall = 'dir="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins" && mkdir -p "$dir" && ln -sf "$MISE_TOOL_INSTALL_PATH/docker-cli-plugin-docker-buildx" "$dir/docker-buildx"' }
