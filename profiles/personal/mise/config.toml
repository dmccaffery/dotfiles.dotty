[settings]
lockfile = true
locked = false
minimum_release_age = "1d"
npm.package_manager = "auto"

[settings.self_update]
auto = true

[settings.upgrade]
prune_after = "3d"
auto_prune = true

[settings.github]
credential_command = "gh auth token"

[settings.dotfiles]
# dotty: capture new dotfiles in the repository
root = "~/Repos/dmccaffery/dotfiles.dotty/home"

[tools]
node = "lts"
go = "latest"
python = "3.15"
"aqua:anchore/quill" = "latest"
"github:bitwise-media-group/patchy" = { version = "latest", matching = "patchy-cli" }
"github:bitwise-media-group/evolve" = "latest"
"aqua:hashicorp/terraform" = "latest"
"npm:actions-up" = "latest"
"github:yt-dlp/yt-dlp" = "latest"
"aqua:google-antigravity/antigravity-cli" = "latest"

[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew:awscli" = "latest"
"brew-cask:hyperkey" = { version = "latest", os = "macos" }
"brew-cask:rectangle" = { version = "latest", os = "macos" }
"brew-cask:gcloud-cli" = { version = "latest", os = "macos" }
"brew-cask:codexbar" = { version = "latest", os = "macos" }
"brew-cask:google-drive" = { version = "latest", os = "macos" }
"brew-cask:tailscale-app" = { version = "latest", os = "macos" }
"brew-cask:unifi-identity-endpoint" = { version = "latest", os = "macos" }
"brew-cask:dropbox" = "latest"

# ipcams
"mas:1045600272" = "latest"
# final cut pro
"mas:1631624924" = "latest"
# pixelmator pro
"mas:6746662575" = "latest"
# motion
"mas:6746637149" = "latest"
# compressor
"mas:6746516157" = "latest"
# logic pro
"mas:1615087040" = "latest"

# keynote
"mas:361285480" = "latest"
# pages
"mas:361309726" = "latest"
# numbers
"mas:361304891" = "latest"

